name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The project is developed on Windows and a few tests exercise Windows
    # path/console behaviour, so CI mirrors the local environment.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (correctness gate)
        # pyproject selects E9/F63/F7/F82; the wider style backlog is tracked
        # in TECH_NOTES.md instead of blocking every change.
        run: ruff check .

      - name: Unit tests
        # Default addopts already exclude e2e/llm. data/ is gitignored, so
        # corpus-dependent tests skip automatically.
        run: pytest -q

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            .pytest_cache
            logs/
          if-no-files-found: ignore
